
shared:
  dataset:             'RossmanSales'
  backbone:            'S4'
  random_seed:         42
  beta_0:              0.0001
  beta_T:              0.02
  timesteps:           200
  hdim:                64
  lr:                  0.0001
  diff_batch_size:     1024
  layers:              4
  window_size:         32
  stride:              1
  num_res_layers:      4
  res_channels:        64
  skip_channels:       64
  diff_step_embed_in:  32
  diff_step_embed_mid: 64
  diff_step_embed_out: 64
  s4_lmax:             100
  s4_dstate:           64
  s4_dropout:          0.0
  s4_bidirectional:    True
  s4_layernorm:        True
  propCycEnc:          False

training:
  epochs:              1000

synthesis:
  synth_mask:          'C' # C = coarse, M = medium, F = fine
  n_trials:            1

autoencoder: # optimized from hyperparameter search
  layer1_dim:          21    # size of hidden dimension
  layer2_dim:          9
  latent_dim:          4     # num of features in latent layer
  dropout_prob:        0.15
  ae_training_epochs:  100
  ae_batch_size:       126
  ae_optimizer_lr:     0.0011
  weight_decay:        0.00001
  training_patience:   70
  scheduler_patience:  70
  scheduler_mode:      'min'
  scheduler_factor:    0.8

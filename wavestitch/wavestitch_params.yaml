# For wavestitch. Need to do hyperparameter search for each dataset
shared:
  backbone:            'S4'   # options: Transformer, Bilinear, Linear, S4
  random_seed:         42
  beta_0:              0.0001 # initial variance schedule (default 1e-4)
  beta_T:              0.02   # last variance schedule (default 0.02)
  timesteps:           200    # training/inference timesteps (default 200)
  hdim:                64     # hidden embedding dimension (default 64)
  lr:                  0.0005 # learning rate (default 1e-4)
  batch_size:          64   # batch size (default 1024)
  layers:              2      # number of hidden layers (default 4)
  window_size:         32     # size of the training windows (default 32)
  stride:              1      # stride length to shift the training window by (default 1)
  num_res_layers:      4      # number of residual layers (default 4)
  res_channels:        32     # number of residual channels (default 64)
  skip_channels:       64     # number of skip channels (default 64)
  diff_step_embed_in:  32     # diffusion input embedding size (default 32)
  diff_step_embed_mid: 64     # diffusion middle embedding size (default 64)
  diff_step_embed_out: 64     # diffusion output embedding size (default 64)
  s4_lmax:             100    # default 64
  s4_dstate:           64     # default 64
  s4_dropout:          0.0    # default 0
  s4_bidirectional:    True   # true (default) or false
  s4_layernorm:        True   # true (default) or false 
  propCycEnc:          False  # true or false (default)

training:
  epochs:              1000   # diffusion training epochs (default 1000)

synthesis:
  synth_mask:          'C'    # C = coarse, M = medium, F = fine
  n_trials:            5      # number of trials (default 5)

autoencoder:                  # need to be optimized per dataset
  layer1_dim:          20     # size of hidden dimension
  layer2_dim:        9
  latent_dim:          4      # num of features in latent layer
  dropout_prob:        0.19
  ae_training_epochs:  30
  ae_batch_size:          32
  optimizer_lr:        0.0011
  weight_decay:        0.00001
  training_patience:   5
  scheduler_patience:  3
  scheduler_mode:      'min'
  scheduler_factor:    0.8
